note: >-
  Sherlock Biosciences publishes no client SDK on any public package registry, because it
  operates no HTTP API for an SDK to wrap. The single first-party software artifact found is
  DTRAPipe, an internal bioinformatics pipeline whose Sphinx-generated reference the company
  published to GitHub Pages. It is a Python library, not an API client, so no `SDKs` pointer
  is wired in apis.yml — only `Packages`.

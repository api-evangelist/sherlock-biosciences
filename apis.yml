aid: sherlock-biosciences
name: Sherlock Biosciences
description: >-
  Sherlock Biosciences is a molecular diagnostics company founded in 2019 out of the Broad Institute to
  commercialize SHERLOCK (Specific High-sensitivity Enzymatic Reporter unLOCKing), the CRISPR-based
  nucleic-acid detection method developed in the Zhang lab, alongside INSPECTR, an ambient-temperature
  synthetic-biology amplification platform. In May 2020 it received the first FDA Emergency Use
  Authorization ever granted to a CRISPR-based diagnostic, for SARS-CoV-2. The company developed
  disposable, instrument-free molecular self-tests, led by a combined Chlamydia trachomatis and Neisseria
  gonorrhoeae assay. OraSure Technologies acquired Sherlock Biosciences in December 2024 and absorbed it
  into its rapid-diagnostics portfolio; the sherlock.bio domain now permanently redirects to orasure.com.
  Sherlock Biosciences is a laboratory diagnostics developer and has never operated a public developer
  program, HTTP API, or machine-readable API contract.
